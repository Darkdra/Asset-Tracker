<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Tracker</title>
<meta name="description" content="A private net worth &amp; liabilities ledger." />

<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#ff1744" />
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Asset Tracker" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ===================== LOGIN VIEW ===================== -->
<section id="view-login">
  <form id="login-form" class="ledger-plate login-card" autocomplete="on">
    <h1>Asset Tracker</h1>
    <p class="tagline">PRIVATE LEDGER</p>

    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="username" required />
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required />
    </div>

    <button type="submit" class="btn btn-primary">Sign in</button>
    <p class="login-error" id="login-error"></p>
  </form>
</section>

<!-- ===================== APP SHELL ===================== -->
<div id="view-app" class="hidden">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="greeting" id="greeting">Hi, there!</span>
      <button class="hamburger" id="btn-collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>

    <nav class="nav-list" id="nav-list">
      <!-- Dashboard nav item (fixed) + dynamic category items injected by app.js -->
    </nav>

    <button class="add-category-btn" id="btn-add-category">
      <span aria-hidden="true">＋</span><span class="add-label">Add category</span>
    </button>

    <button class="sidebar-sign-out" id="btn-sign-out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="add-label">Sign out</span>
    </button>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="theme-switch" id="theme-switch" title="Switch theme" aria-label="Switch theme">
        <span class="knob" id="theme-knob">🌙</span>
      </button>

      <select class="currency-select" id="currency-select" aria-label="Currency" title="Display currency"></select>

      <div class="settings-menu-wrap">
        <button class="btn btn-icon" id="btn-settings" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="ledger-plate settings-panel hidden" id="settings-panel">
          <button id="btn-install-app" class="hidden">Install app</button>
          <button id="btn-change-username">Change username</button>
          <button id="btn-change-password">Change password</button>
        </div>
      </div>
    </header>

    <main class="main-content" id="main-content">
      <!-- Dashboard / category views rendered here by app.js -->
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // Non-fatal — the app still works fully online without it.
      });
    });
  }
</script>
</body>
</html>
